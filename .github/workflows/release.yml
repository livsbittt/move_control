name: release

# Turns a tag into the verified artifact the robot installs. The tests run
# again here rather than trusting the push build, so nothing reaches a robot
# without having passed on the exact commit being released.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (must already exist)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0          # make_bundle.sh needs tags for git describe

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/ci/requirements-dev.txt

      - name: Run test suite
        run: ./tools/ci/run_tests.sh

      - name: Build bundle
        id: bundle
        run: |
          ./tools/ci/make_bundle.sh --ref HEAD
          echo "version=$(ls dist/*.manifest.json | head -1 | sed 's:.*/move_control-::; s:\.manifest\.json$::')" >> "$GITHUB_OUTPUT"

      # Fail loudly here rather than on the robot: the updater refuses any
      # release that is missing one of the three assets.
      - name: Verify the bundle is self-consistent
        run: |
          cd dist
          tar=$(ls *.tar.gz)
          sha256sum -c "$tar.sha256"
          test -f "${tar%.tar.gz}.manifest.json"
          tar -tzf "$tar" | head -1 | grep -q '^move_control/'
          echo "bundle ok: $tar"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.manifest.json
          body: |
            move_control ${{ steps.bundle.outputs.version }}

            Install on the robot (source only -- this does not start driving):

                ~/pinky-deploy/pinky_update.sh --from-github --tag ${{ github.event.inputs.tag || github.ref_name }}

            The updater verifies the sha256, refuses to switch while the robot
            is driving, and rolls back if the build or test suite fails.
