wander_node:
  ros__parameters:
    cmd_topic: /cmd_vel_raw
    odom_topic: /odom
    # Narrow path: cruise 1.4cm/s, think 3mm/s. v = min(blend, gap/think_horizon, odom-safe).
    vmax: 0.014
    vmax_think: 0.003
    vback: 0.004
    vback_think: 0.002
    wturn: 0.10
    wturn_think: 0.045
    slow_front: 0.04
    slow_rear: 0.03
    think_horizon: 0.50
    auto_start: true
    pause_sec: 0.25
    # Judge: look (sample) → calc (score) → maybe recon (look again).
    look_sec: 0.40
    calc_sec: 0.20
    recon_sec: 1.20
    recon_max: 2
    backup_m: 0.025
    backup_max_m: 0.12
    # Spin only if F and the turn-into side are farther than this; else reverse.
    turn_clear_m: 0.08
    turn_back_max: 2
    backup_min_sec: 0.15
    backup_clear_sec: 0.20
    backup_max_sec: 4.00
    turn_deg: 70.0
    turn_sec: 4.0
    # Escape only when front is close AND tighter than the nearer wall.
    # Side-gap corridors must keep driving. auto_escape raises/lowers these.
    open_ratio: 2.0
    hug_ratio: 0.50
    pinch_ratio: 1.55
    escape_front: 0.08
    escape_front_min: 0.040
    escape_front_max: 0.14
    escape_hold_sec: 0.40
    auto_escape: true
    align_deg: 22.0
    far_scale: 1.8
    stuck_sec: 1.2
    stuck_m: 0.008
    steer_k: 0.9
    steer_wmax: 0.05
