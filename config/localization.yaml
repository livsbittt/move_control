amcl:
  ros__parameters:
    base_frame_id: base_link
    odom_frame_id: odom
    global_frame_id: map
    scan_topic: /scan
    tf_broadcast: true
    transform_tolerance: 0.3
    set_initial_pose: false
    always_reset_initial_pose: true
    robot_model_type: nav2_amcl::DifferentialMotionModel
    min_particles: 1500
    max_particles: 12000
    pf_err: 0.02
    pf_z: 0.99
    alpha1: 0.02
    alpha2: 0.02
    alpha3: 0.02
    alpha4: 0.02
    update_min_d: 0.005
    update_min_a: 0.02
    resample_interval: 1
    recovery_alpha_fast: 0.1
    recovery_alpha_slow: 0.001
    laser_model_type: likelihood_field
    max_beams: 180
    laser_likelihood_max_dist: 0.15
    sigma_hit: 0.03
    z_hit: 0.95
    z_rand: 0.05
    laser_min_range: 0.05
    laser_max_range: 8.0
    save_pose_rate: -1.0
localization_monitor:
  ros__parameters:
    scan_timeout: 0.5
    pose_timeout: 2.0
    minimum_agreement: 0.85
    wall_tolerance: 0.04
    position_stddev: 0.035
    yaw_stddev: 0.12
    stable_scans: 10
    recovery_interval: 30.0
    global_minimum_agreement: 0.9
    global_minimum_margin: 0.04
