safety_node:
  ros__parameters:
    cmd_in: /cmd_vel_raw
    cmd_out: /cmd_vel
    scan_topic: /scan
    us_topic: /us_sensor/range
    ir_topic: /ir_sensor/range
    # Distances, yaw, drive sign: robot.yaml (load first).
    us_scale: 1.0
    us_invalid_hold: 5
    us_hits: 3
    sensor_timeout: 1.0
    camera_as_wall: false
    # Maze corners: camera obstacle = turn (not reverse). Cliff/drop stays off.
    camera_block_as_wall: true
    imu_topic: /imu_raw
    tilt_deg: 20.0
    gyro_dps: 90.0
    pickup_acc: 3.5
    imu_roll0: 0.0
    imu_pitch0: 0.0
    camera_cliff_topic: /camera/cliff
    camera_block_topic: /camera/blocked
    cliff_enable: true
    cliff_hits: 2
    # Median spike kill + Fourier low-pass (fc Hz) so ranges are not twitchy.
    filt_median: 5
    filt_hz: 1.5
    # Yaw / percentile: robot.yaml. Drop remote /scan in code.
