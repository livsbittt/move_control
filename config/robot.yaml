# Single source for every Pinky node. Load this file FIRST.
#   ros2 launch ... parameters: [robot.yaml, <node>.yaml]
#
# /** applies the same numbers to safety, wander, lcd, calib.
/**:
  ros__parameters:
    # A safety restart must not silently release a physical emergency stop.
    start_estopped: true
    calibration_required: true
    calibration_round_trip: true
    calibration_distance_m: 0.03
    calibration_rotation: true
    # Zero adds no configured floor; physical geometry is still validated.
    # stop/clear_distance below are initial defaults, not recurring overrides.
    safety_stop_floor: 0.0
    safety_clear_floor: 0.0
    safety_max_linear: 0.014
    safety_max_angular: 0.10
    # Installed Pinky BNO055 driver publishes raw /16 values in degrees/s.
    imu_angular_velocity_unit: deg_s
    # Maze echoes vary 15 cm while stationary. Keep US as obstacle guard;
    # precise motion agreement uses lidar, wheel odometry and map TF.
    calibration_require_us_agreement: false
    # Installed ADC conversion saturates near .9698 m despite max_range=3.
    calibration_us_max_range: 0.95
    # Lidar-origin range: body radius 76mm + offset 17mm + stand-off 18mm.
    # Round the conservative 111mm floor upward; the C1 cannot see 18mm.
    stop_distance: 0.12
    stop_front: 0.12
    clear_distance: 0.14
    us_stop_distance: 0.020
    us_clear_distance: 0.028
    # Wander's close-wall bands remain advisory; safety's body envelope wins.
    wall_front: 0.14
    warn_front: 0.18
    # +1 = wander forward is nose-first. Do not auto-flip.
    cmd_linear_sign: 1.0
    auto_linear_sign: false
    # Scan 0 = back. Nose ≈ 190deg (US 16cm matched lidar 14.7cm; 180deg was 12cm).
    lidar_yaw_offset: 3.31612558
    scan_yaw_offset: 3.31612558
    scan_pctl: 0.10
    scan_ignore_m: 0.04
    front_half_width_deg: 45.0
    cliff_raw_max: 800
    cliff_clear_raw: 1500
    cliff_mode: low
    # Circumradius from base_link (URDF rear caster 7.6cm). Calib yaml wins if set.
    robot_radius: 0.076
    # Narrow maze HUD / opening cap. Safety auto-cals from L+R.
    auto_map: true
    map_range: 0.28
    map_range_min: 0.18
    map_range_max: 0.40
    open_max: 0.40
