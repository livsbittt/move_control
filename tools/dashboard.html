<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>pinky planning</title>
<style>
body { background:#22262b; color:#dfe5ec; font-family:monospace; margin:0; }
#wrap { display:flex; flex-direction:row; height:100vh; }
#map { background:#151a1f; }
#side { padding:10px 14px; width:290px; }
pre { margin:2px 0; white-space:pre-wrap; }
button { background:#2f3a45; color:#dfe5ec; border:1px solid #4a5a6a;
         border-radius:4px; padding:6px 10px; margin:2px; cursor:pointer; }
button:active { background:#5a7a9a; }
.row { margin:6px 0; }
b { color:#8fd0ff; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="map" width="640" height="640"></canvas>
  <div id="side">
    <h3>pinky planning</h3>
    <div class="row">state: <b id="st">-</b></div>
    <div class="row">pose: <b id="pose">-</b></div>
    <div class="row">goal: <b id="goal">-</b></div>
    <div class="row">eta: <b id="eta">-</b></div>
    <div class="row">
      <button onclick="cmd('explore')">explore</button>
      <button onclick="cmd('coverage')">coverage</button>
      <button onclick="cmd('stop')">stop</button>
    </div>
    <div class="row">
      <b>teleop</b> (sim: /cmd_vel)<br>
      <button onclick="tw(0,0.5)">&#8592;</button>
      <button onclick="tw(-0.1,0)">&#8595;</button>
      <button onclick="tw(0,0)">stop</button>
      <button onclick="tw(0.1,0)">&#8593;</button>
      <button onclick="tw(0,-0.5)">&#8594;</button>
    </div>
    <div class="row">options: <span id="nopt">0</span> | route pts: <span id="nrp">0</span></div>
    <div class="row"><b>mapping result</b><br>
      <img id="resimg" src="/map.png" width="280" style="margin:4px 0; image-rendering:pixelated; border:1px solid #4a5a6a;">
      <table id="res_t" style="font-size:12px"></table>
    </div>
    <div class="row">/goal/options shows every frontier route the planner
      considered; marker 0 = chosen.</div>
  </div>
</div>
<script>
async function cmd(m) {
  await fetch('/cmd', {method:'POST', body:m});
}
async function tw(x, z) {
  await fetch('/teleop', {method:'POST', body:JSON.stringify({x:x, z:z})});
}
async function poll() {
  const r = await fetch('/state.json');
  const s = await r.json();
  st.textContent = s.state || '-';
  pose.textContent = s.pose ? s.pose.slice(0,2) : '-';
  goal.textContent = s.goal || '-';
  eta.textContent = s.eta != null ? s.eta + ' s' : '-';
  nopt.textContent = (s.options || []).length;
  nrp.textContent = (s.route || []).length;
  draw(s);
}

async function pollResult() {
  const r = await fetch('/result.json');
  const s = await r.json();
  const im = document.getElementById('resimg');
  im.src = '/map.png?t=' + Date.now();
  const t = document.getElementById('res_t');
  t.innerHTML = '<tr><td>path</td><td>' + (s.path != null ? s.path + ' m' : '-') +
    '</td></tr>' +
    '<tr><td>state</td><td>' + (s.state || '-') + '</td></tr>' +
    '<tr><td>ok</td><td>' + (s.metrics ? s.metrics.ok : '-') + '</td></tr>';
  if (s.metrics) {
    const m = s.metrics;
    const rows = [['wall_recall', m.wall_recall], ['corridor_purity', m.corridor_purity],
                  ['phantom', m.phantom_frac], ['unknown', m.interior_unknown]];
    for (const [k, v] of rows) {
      t.innerHTML += '<tr><td>' + k + '</td><td>' + v + '</td></tr>';
    }
  }
}
setInterval(pollResult, 5000);
pollResult();

</script>
<script>
const c = document.getElementById('map').getContext('2d');
function draw(s) {
  c.fillStyle = '#10151a';
  c.fillRect(0, 0, 640, 640);
  if (!s.map) return;
  const [w, h, res, ox, oy, data] = s.map;
  const sc = 640 / Math.max(w, h);
  for (let r = 0; r < h; r++) {
    for (let cc = 0; cc < w; cc++) {
      const v = data[r * w + cc];
      if (v === 1) c.fillStyle = '#e8eef4';
      else if (v === 0) c.fillStyle = '#1d2731';
      else continue;
      c.fillRect(cc * sc, (h - 1 - r) * sc, Math.ceil(sc), Math.ceil(sc));
    }
  }
  const W2C = (x, y) => [ (x - ox) / res * sc, (h - 1 - (y - oy) / res) * sc ];
  function line(pts, color, width) {
    if (!pts || pts.length < 2) return;
    c.strokeStyle = color; c.lineWidth = width || 1.5;
    c.beginPath();
    pts.forEach((p, i) => {
      const [px, py] = W2C(p[0], p[1]);
      if (i === 0) c.moveTo(px, py); else c.lineTo(px, py);
    });
    c.stroke();
  }
  (s.options || []).forEach((o, i) => line(o, i === 0 ? '#4dff88' : '#ffb04d', i === 0 ? 3 : 1.5));
  line(s.route, '#57b9ff', 2);
  if (s.goal) {
    const [gx, gy] = W2C(s.goal[0], s.goal[1]);
    c.strokeStyle = '#ff5555'; c.lineWidth = 2;
    c.beginPath(); c.moveTo(gx - 6, gy - 6); c.lineTo(gx + 6, gy + 6);
    c.moveTo(gx + 6, gy - 6); c.lineTo(gx - 6, gy + 6); c.stroke();
  }
  if (s.pose) {
    const [px, py] = W2C(s.pose[0], s.pose[1]);
    const yaw = s.pose[2] || 0;
    c.fillStyle = '#57b9ff';
    c.beginPath(); c.arc(px, py, 5, 0, 7); c.fill();
    c.strokeStyle = '#57b9ff'; c.lineWidth = 2;
    c.beginPath(); c.moveTo(px, py);
    c.lineTo(px + 12 * Math.cos(yaw), py - 12 * Math.sin(yaw));
    c.stroke();
  }
}
setInterval(poll, 500);
poll();
</script>
</body>
</html>
