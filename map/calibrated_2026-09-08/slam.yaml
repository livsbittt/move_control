slam_toolbox:
  ros__parameters:
    base_frame: base_link
    debug_logging: false
    map_frame: map
    map_update_interval: 1.0
    max_laser_range: 3.0
    min_laser_range: 0.05
    minimum_time_interval: 0.2
    minimum_travel_distance: 0.02
    minimum_travel_heading: 0.08
    mode: mapping
    odom_frame: odom
    resolution: 0.02
    scan_topic: /scan
    stack_size_to_use: 40000000
    throttle_scans: 1
    transform_publish_period: 0.05
    transform_timeout: 0.5
    use_map_saver: true
    use_scan_matching: false
